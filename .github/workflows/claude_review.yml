name: Claude code review

# Claude Code reviews a pull request with its code-review plugin and comments
# on the changed lines as the Claude GitHub App. This is the review workflow
# from https://code.claude.com/docs/en/github-actions.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.user.login != 'dependabot[bot]' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ secrets.CLAUDE_REVIEW_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ secrets.CLAUDE_REVIEW_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ secrets.CLAUDE_REVIEW_SERVICE_ACCOUNT_ID }}
          allowed_bots: ${{ secrets.CODE_REVIEW_ALLOWED_BOTS }}
          # Without this the plugin's review agents start in the background and
          # the action ends the run before they report (claude-code-action#1646).
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
